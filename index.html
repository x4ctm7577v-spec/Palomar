<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#CDE5DE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1916" media="(prefers-color-scheme: dark)">
<meta name="description" content="Mi Palomar: pedigree, carreras, capturas, cría y comunidad para palomeros.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Palomar">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mi Palomar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>

:root{
  --bg:#CDE5DE; --bg-2:#E3F1ED; --surface:#FFFFFF; --surface-2:#EEF6F3; --ink:#0F1513; --muted:#53635E; --line:#D2E2DC;

  --slate:#0F1513; --slate-2:#1B2421; --on-slate:#FFFFFF; --on-slate-muted:#B7C6C1; --pri:#0F1513;

  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:22px;
}

:root[data-theme="dark"]{
  --bg:#0E1916; --bg-2:#13211E; --surface:#18241F; --surface-2:#121D19; --ink:#EAF4F0; --muted:#9FB3AD; --line:#253530;
  --pill:#EAF4F0; --on-pill:#0F1513; --warm:#E9A92F;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:34px;height:34px;color:var(--accent)}
.brand h1{font-size:28px;text-transform:uppercase;letter-spacing:.04em}
.brand h1 span{color:var(--sheen)}
.tabs{display:flex;gap:4px;max-width:100%;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{white-space:nowrap;border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
main{padding-block:18px 60px}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-radius:var(--r);border:1px dashed var(--sheen);background:var(--surface);margin-bottom:16px;font-size:14px}
.notice b{color:var(--sheen)}
.notice.plain{border-style:solid;border-color:var(--line);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;min-height:42px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn:focus-visible,.tabs button:focus-visible,.card:focus-visible,.pbox:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sheen);outline-offset:2px}
.search{flex:1 1 220px;min-width:0;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.card{display:grid;grid-template-columns:72px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.thumb{width:72px;height:72px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:44px;height:44px}
.card .nm{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.1;display:flex;gap:6px;align-items:baseline}
.sx{font-family:var(--f-body);font-size:13px;font-weight:700}
.sx.M{color:var(--accent)} .sx.H{color:var(--sheen)}
.band{display:inline-block;font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--band);color:var(--band-ink);padding:1px 7px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.meta{color:var(--muted);font-size:13px;min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;margin-top:4px;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor;text-transform:uppercase;letter-spacing:.05em}
.pill.lo{color:var(--ok)} .pill.mid{color:var(--warn)} .pill.hi{color:var(--danger)} .pill.mut{color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:24px;margin-bottom:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec-h h2{font-size:24px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
/* Ficha */
.fhead{display:grid;grid-template-columns:140px 1fr;gap:18px;align-items:start}
.fhead .thumb{width:140px;height:140px}
.fhead .thumb svg{width:80px;height:80px}
.fhead h2{font-size:40px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px 18px;margin-top:12px}
.kv div{min-width:0}
.kv .v{font-weight:600;overflow-wrap:anywhere}
.subtabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-top:20px;overflow-x:auto}
.subtabs button{border:0;background:none;padding:10px 2px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.subtabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.fam{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mini{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.mini:hover{border-color:var(--accent)}
.mini .nm{font-weight:700}
.mini.none{cursor:default;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.item .t{font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
tr:last-child td{border-bottom:0}
.pos1{color:var(--band);font-weight:700}
/* Pedigree */
.pedwrap{overflow-x:auto;padding:4px 2px 10px}
.ped{display:grid;grid-template-columns:repeat(4,minmax(175px,1fr));grid-template-rows:repeat(8,auto);gap:6px 22px;min-width:780px}
.pbox{position:relative;align-self:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;width:100%}
.pbox.M{border-left-color:var(--accent)} .pbox.H{border-left-color:var(--sheen)}
.pbox.root{border-width:2px 2px 2px 6px}
.pbox.unk{cursor:default;border-style:dashed;color:var(--muted);background:var(--surface-2)}
.pbox::before{content:"";position:absolute;left:-23px;top:50%;width:22px;border-top:1px solid var(--line)}
.pbox.root::before{display:none}
.pbox .rel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.pbox .nm{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.1}
.pbox .res{font-size:12px;color:var(--muted);margin-top:3px}
.dup{position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:var(--surface);font-size:11px;font-weight:700;display:grid;place-items:center}
/* Parentesco */
.relgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result{margin-top:16px}
.result h3{font-size:30px}
.big{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--sheen))}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:min(620px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px}
.modal h2{font-size:28px;margin-bottom:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-weight:500;color:var(--ink);min-width:0;width:100%}
.form textarea{min-height:70px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
/* Navegación de abajo y atajos */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:none;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);background:none;border:0;padding:4px 0;cursor:pointer;min-width:0}
.bnav svg{width:26px;height:26px}
.bnav button[aria-current="true"]{color:var(--accent)}
.bnav button[aria-current="true"] svg{stroke-width:2.4}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;min-width:0}
.qa button:hover{border-color:var(--accent)}
.qa button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qa .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent)}
.qa .main .ic{background:rgba(255,255,255,.18);color:var(--accent-ink)}
.qa .ic svg{width:24px;height:24px}
.qa b{font-size:16px;line-height:1.2}
.qa small{font-size:12.5px;opacity:.8;line-height:1.3}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{flex-direction:row!important;align-items:center;justify-content:center;gap:6px!important;border:1px solid var(--line);border-radius:10px;padding:12px 6px;cursor:pointer;color:var(--ink)!important;font-size:15px!important;background:var(--surface-2)}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px!important}
.seg label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));font-weight:700}
.seg label:has(input:focus-visible){outline:2px solid var(--sheen)}
details.more{grid-column:1/-1;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
details.more summary{cursor:pointer;font-weight:700;color:var(--accent)}
details.more .form{margin-top:12px}
.picklist{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto;margin-top:10px}
.picklist button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.picklist button:hover{border-color:var(--accent)}
.explain{font-size:14px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-top:8px}
@media (max-width:720px){
  .bnav{display:grid}
  .top .tabs{display:none}
  main{padding-bottom:110px}

  .tablero .nums{grid-template-columns:repeat(3,1fr);row-gap:12px}
  .tablero .n{font-size:34px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
/* Tutorial */
.tour{background:var(--surface);border-radius:18px;border:1px solid var(--line);width:min(520px,100%);max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column}
.tour .art{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--surface-2)),color-mix(in srgb,var(--sheen) 14%,var(--surface-2)));padding:22px;display:grid;place-items:center;min-height:190px}
.tour .txt{padding:18px 22px 6px}
.tour .step{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sheen)}
.tour h2{font-size:34px;margin:4px 0 8px}
.tour p{margin:0 0 8px;color:var(--muted);font-size:15.5px}
.tour ul{margin:4px 0 8px;padding-left:20px;color:var(--ink)}
.tour li{margin-bottom:4px}
.tour .vid{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 22px 0}
.tour .phone{width:auto;height:min(46vh,420px);max-width:100%;aspect-ratio:390/740;border:7px solid var(--ink);border-radius:26px;overflow:hidden;background:var(--surface-2);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.tour .phone video{width:100%;height:100%;object-fit:cover;display:block}
@media (max-height:740px){.tour .phone{height:38vh}}
.tour .nav{display:flex;align-items:center;gap:10px;padding:14px 22px 18px;flex-wrap:wrap}
.dots{display:flex;gap:6px;margin-right:auto}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:22px;border-radius:4px}
.art .demo{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.08);min-width:0}
.art .mped{display:grid;grid-template-columns:auto auto;gap:8px 16px;align-items:center}
.art .mped .demo{padding:6px 10px;font-size:13px}
.art .nmb{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1}
#helpBtn{margin-left:4px}
@media (max-width:640px){#helpBtn{padding:4px 8px;font-size:12px}.tour h2{font-size:28px}}
/* Cría, salud, ranking */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
.steps div{font-size:11.5px;color:var(--muted);border-top:4px solid var(--line);padding-top:4px;min-width:0}
.steps div.done{border-top-color:var(--accent);color:var(--ink)}
.steps div.now{border-top-color:var(--band);color:var(--ink);font-weight:700}
.steps b{display:block;font-variant-numeric:tabular-nums}
.agenda{display:flex;flex-direction:column;gap:6px}
.ag{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.ag .d{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ag.late{border-color:var(--danger)} .ag.late .d{color:var(--danger)}
.ag.today{border-color:var(--band)}
.nest{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.rank td:first-child{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--muted)}
.rank tr:nth-child(1) td:first-child{color:var(--band)}
.rank a,.linkbtn{color:var(--ink);font-weight:600;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
/* Mercado y foro */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.ad{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ad .ph{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.ad .ph img{width:100%;height:100%;object-fit:cover}
.ad .ph svg{width:70px;height:70px}
.ad .bd{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.ad .price{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.ad.sold{opacity:.6}
.tag{display:inline-block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:4px;background:var(--ink);color:var(--bg)}
.tag.Compro{background:var(--sheen);color:var(--surface)} .tag.Cambio{background:var(--accent);color:var(--accent-ink)}
.ped-txt{font-size:12.5px;background:var(--surface-2);border-radius:6px;padding:6px 8px;color:var(--muted)}
.contact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;width:100%;display:block}
.post:hover{border-color:var(--accent)}
.post h3{font-size:22px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who img{width:24px;height:24px;border-radius:50%}
.reply{border-left:3px solid var(--line);padding:6px 0 6px 12px}
.body-txt{white-space:pre-wrap;overflow-wrap:anywhere}
.compose{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.compose textarea{min-height:80px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);resize:vertical;width:100%}
@media (max-width:640px){
  .brand h1{font-size:23px}
  .tabs{width:100%;flex-wrap:wrap;border-radius:14px} .tabs button{flex:1 0 auto;padding:7px 10px}
  .fhead{grid-template-columns:96px 1fr;gap:12px}
  .fhead .thumb{width:96px;height:96px}
  .fhead h2{font-size:30px}
  .form,.relgrid,.twocol{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.card,.pbox,.mini{transition:border-color .15s}}

/* ===== Identidad "cielo de palomar" ===== */
body{background:var(--bg) var(--deco);background-attachment:fixed}
h1,h2,h3{font-weight:800;letter-spacing:-.01em}
.top{background:transparent;border:0;position:sticky;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top .wrap{padding-block:14px}
.brand{gap:10px;min-width:0;flex:1}
.brand svg{width:40px;height:40px;padding:8px;border-radius:50%;background:var(--pill);color:var(--on-pill)}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.01em;text-transform:none;white-space:nowrap}
.brand h1 span{color:var(--ink)}
#helpBtn{margin-left:auto;min-width:44px;min-height:44px;border-radius:50%;padding:0;background:var(--surface);border:0;font-size:18px;font-weight:800;box-shadow:0 4px 14px -6px rgba(15,21,19,.25)}
#helpBtn .hl{display:none}
.tabs{background:var(--surface);border:0;box-shadow:0 6px 20px -12px rgba(15,21,19,.35)}
.tabs button{color:var(--muted);font-weight:700}
.tabs button[aria-current="true"]{background:var(--pill);color:var(--on-pill)}
.btn{border-radius:999px;border:0;background:var(--surface);box-shadow:0 4px 14px -8px rgba(15,21,19,.28);font-weight:700}
.btn:hover{box-shadow:0 0 0 2px var(--ink)}
.btn.pri{background:var(--pill);color:var(--on-pill);box-shadow:none}
.btn.pri:hover{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--pill)}
.btn.danger{color:var(--danger)}
.notice{border:0;background:var(--surface);border-radius:20px;box-shadow:0 6px 20px -14px rgba(15,21,19,.4)}
.notice b{color:var(--ink)}
.search{border:0;border-radius:999px;padding-inline:18px;background:var(--surface);box-shadow:0 4px 14px -10px rgba(15,21,19,.3)}
.chip{border:0;background:var(--surface);padding:10px 18px;font-weight:600;font-size:15px;box-shadow:0 4px 14px -10px rgba(15,21,19,.3)}
.chip[aria-pressed="true"]{background:var(--pill);color:var(--on-pill)}
.band{font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.03em;color:var(--alu-ink);background:linear-gradient(180deg,var(--alu-1) 0%,var(--alu-2) 52%,var(--alu-1) 100%);border:1px solid var(--alu-edge);border-radius:999px;padding:1px 8px 1px 13px;position:relative}
.band::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:4px;border-radius:2px;background:var(--band)}
/* saludo y tablero */
.hello{margin:4px 0 14px}
.hello h2{font-size:34px;line-height:1.05}
.hello p{margin:4px 0 0;color:var(--muted);font-size:16px}
.tablero{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
.tablero > div{background:var(--surface);border-radius:18px;padding:10px 12px;box-shadow:0 6px 18px -14px rgba(15,21,19,.4);min-width:0}
.tablero .n{font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tablero .l{font-size:12px;color:var(--muted);font-weight:600}
/* atajos */
.qa button{border:0;border-radius:24px;box-shadow:0 8px 22px -16px rgba(15,21,19,.45);padding:16px}
.qa button:hover{box-shadow:0 0 0 2px var(--ink)}
.qa button.main{background:var(--pill);color:var(--on-pill)}
.qa .ic{width:44px;height:44px;border-radius:50%;background:var(--pill);color:var(--on-pill)}
.qa .main .ic{background:var(--surface);color:var(--ink)}
.qa b{font-size:18px;font-weight:800}
/* tarjetas de paloma (estilo ficha) */
.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;border:0;border-radius:26px;padding:10px 10px 14px;background:var(--surface);box-shadow:0 10px 26px -18px rgba(15,21,19,.5)}
.card:hover{box-shadow:0 0 0 2px var(--ink)}
.card .thumb{width:100%;height:auto;aspect-ratio:1/1;max-width:100%;border-radius:20px;background:var(--surface-2);position:relative;box-shadow:none}
.card .thumb svg{width:46%;height:46%;color:var(--muted);opacity:.6}
.card.M .thumb,.card.H .thumb{box-shadow:none}
.card .nm{font-size:20px;font-weight:800;padding-inline:4px}
.card > div:last-child{padding-inline:4px}
.card .stats{gap:4px 8px}
.sexdot{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;background:var(--surface);box-shadow:0 4px 10px -4px rgba(0,0,0,.3)}
.sexdot.M{color:var(--accent)} .sexdot.H{color:var(--sheen)}
/* ficha */
.fhero{position:relative;background:transparent;padding:6px 0 0;display:grid;place-items:center;min-height:300px}
.fhero .circ{position:absolute;top:0;width:46px;height:46px;border-radius:50%;background:var(--surface);border:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px -6px rgba(15,21,19,.3);font-size:20px;font-weight:800;color:var(--ink)}
.fhero .circ svg{width:22px;height:22px}
.fhero .circ.l{left:0} .fhero .circ.r{right:0}
.pcard{position:relative;width:min(260px,70vw);aspect-ratio:1/1;margin:26px auto 0}
.pcard::before{content:"";position:absolute;inset:0;border-radius:34px;background:var(--warm);transform:rotate(8deg) translate(8px,4px)}
.pcard .ph{position:absolute;inset:0;border-radius:34px;overflow:hidden;transform:rotate(-4deg);background:var(--surface-2);display:grid;place-items:center;box-shadow:0 18px 36px -18px rgba(0,0,0,.5);color:var(--muted)}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .ph svg{width:55%;height:55%;opacity:.5}
.sheet{background:var(--surface);border-radius:34px;padding:22px 18px 18px;margin-top:-6px;box-shadow:0 -6px 30px -20px rgba(15,21,19,.4)}
.sheet .who-l{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sheet h2.name{font-size:38px;line-height:1.05;margin:6px 0 2px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.tile{background:var(--surface-2);border-radius:20px;padding:12px;min-width:0}
.tile .tl{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted);font-size:14px}
.tile .tl i{width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal}
.tile .tl svg{width:16px;height:16px}
.tile .tv{font-size:26px;font-weight:800;margin-top:6px;line-height:1.1;overflow-wrap:anywhere}
.tile .tv small{font-size:14px;font-weight:600;color:var(--muted)}
.about{background:var(--surface-2);border-radius:20px;padding:14px 16px;margin-top:10px}
.about h3{font-size:18px;margin-bottom:4px}
.about p{margin:0;color:var(--muted)}
.actbar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.actbar .cbtn{width:52px;height:52px;border-radius:50%;background:var(--pill);color:var(--on-pill);border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.actbar .cbtn svg{width:22px;height:22px}
.pillbtn{flex:1;min-width:180px;display:flex;align-items:center;gap:12px;height:52px;border-radius:999px;background:var(--pill);color:var(--on-pill);border:0;padding:5px 22px 5px 5px;font-weight:700;font-size:17px;cursor:pointer}
.pillbtn .pc{width:42px;height:42px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none}
.pillbtn .pc svg{width:22px;height:22px}
.pillbtn.light{background:var(--surface);color:var(--ink);box-shadow:0 4px 14px -8px rgba(15,21,19,.3)}
.pillbtn.light .pc{background:var(--pill);color:var(--on-pill)}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.subtabs{border-bottom:0;gap:8px;margin-top:18px}
.subtabs button{border:0!important;background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:700;color:var(--muted);box-shadow:0 4px 14px -10px rgba(15,21,19,.3)}
.subtabs button[aria-current="true"]{background:var(--pill);color:var(--on-pill)}
/* paneles */
.panel,.nest,.ad,.post,.empty,.item,.mini,.ag,.tablewrap{border:0;border-radius:22px;box-shadow:0 8px 22px -18px rgba(15,21,19,.5)}
.empty{background:var(--surface)}
.mini{background:var(--surface)}
.pedwrap{background:var(--surface);border-radius:26px;padding:14px;box-shadow:0 8px 22px -18px rgba(15,21,19,.5)}
.pbox{border-radius:16px;border:0;background:var(--surface-2);box-shadow:none;border-left:5px solid var(--line)}
.pbox.M{border-left-color:var(--accent)} .pbox.H{border-left-color:var(--sheen)}
.pbox.root{background:var(--pill);color:var(--on-pill);border-left-color:var(--warm)}
.pbox.root .rel,.pbox.root .meta,.pbox.root .res{color:inherit;opacity:.75}
.pbox .nm{font-weight:800}
.pbox.unk{background:transparent;border:2px dashed var(--line)}
.pfoto{float:right;width:44px;height:44px;border-radius:50%;object-fit:cover;margin:0 0 4px 8px;box-shadow:0 0 0 2px var(--surface)}
.pbox .dup{z-index:1;top:-9px;right:auto;left:-9px;box-shadow:0 0 0 2px var(--surface)}
.tag{border-radius:999px;padding:3px 10px;font-weight:700}
.rank tr:nth-child(1) td:first-child{color:#C28A14}
/* navegación flotante */
.bnav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:8px;border-radius:999px;background:var(--surface);border:0;box-shadow:0 14px 34px -14px rgba(15,21,19,.5)}
.bnav button{color:var(--muted);border-radius:999px;padding:6px 0;font-size:11.5px}
.bnav button svg{width:24px;height:24px}
.bnav button[aria-current="true"]{background:var(--pill);color:var(--on-pill)}
.bnav button[aria-current="true"] svg{stroke-width:2.2}
/* modales y tutorial */
.modal,.tour{border:0;border-radius:30px}
.modal h2,.tour h2{text-transform:none}
.form input,.form select,.form textarea{border:0;background:var(--surface-2);border-radius:14px}
.seg label{border:0!important;border-radius:999px!important}
.seg label:has(input:checked){background:var(--pill)!important;color:var(--on-pill)!important}
.tour{background:var(--bg-2)}
.tour .art{background:var(--bg) var(--deco)}
.tour .step{color:var(--accent)}
.tour .phone{border-color:var(--pill)}
.dots i.on{background:var(--pill)}
/* pantalla de bienvenida */
.splash{position:relative;background:var(--bg) var(--deco);padding:22px 22px 14px;overflow:hidden}
.splash .bigpig{color:var(--pill)}
.splash .bigpig svg{width:100%;height:auto;display:block}
.splash .stage{position:relative;height:clamp(200px,34vh,280px)}
.splash .bigpig{position:absolute;left:-4%;top:0;width:66%}
.splash .shot{position:absolute;right:0;bottom:4px;width:42%;aspect-ratio:1/1;border-radius:26px;overflow:hidden;transform:rotate(6deg);box-shadow:0 18px 32px -16px rgba(0,0,0,.5);background:var(--warm)}
.splash .shot img{width:100%;height:100%;object-fit:cover}
.splash .ring{position:absolute;left:24%;bottom:10px;font-family:var(--f-mono);font-weight:700;font-size:13px;transform:rotate(-8deg)}
.splash h2{font-size:48px;letter-spacing:-.03em;margin-top:6px}
.splash p{margin:2px 0 0;color:var(--muted);font-size:17px}
@media (max-width:720px){
  .brand h1{font-size:22px}
  .tablero{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:1fr 1fr;gap:12px}
  .tiles{grid-template-columns:1fr 1fr}
  .card .nm{font-size:18px}
  main{padding-bottom:120px}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .hello h2{font-size:30px}
}

<script type="module">
const CFG = window.PALOMAR_CONFIG || {};
const configured = !!(CFG.firebase && CFG.firebase.apiKey && !/PEGA/i.test(CFG.firebase.apiKey));
const q = s => document.querySelector(s);
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} };
const loginEl = q("#login"), acctBtn = q("#acctBtn");
let resolved = false, mode = null;
const done = val => { if (resolved) return; resolved = true; mode = val ? "cloud" : "local"; window.__palomarReady(val); };

if (!configured) {
  if (acctBtn) acctBtn.hidden = true;
  done(null);
} else {
  try {
    const V = "10.12.2";
    const [appMod, authMod, fs] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
    ]);
    const app = appMod.initializeApp(CFG.firebase);
    const auth = authMod.getAuth(app);
    let fdb;
    try { fdb = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
    catch(e){ fdb = fs.getFirestore(app); }

    const mapErr = e => !e ? "unavailable" : e.code === "permission-denied" ? "invalid_argument" : e.code === "resource-exhausted" ? "quota_exceeded" : e.code === "invalid-argument" ? "invalid_argument" : "unavailable";
    const wrapErr = e => ({ code: mapErr(e), message: (e && e.message) || "" });
    const snapDoc = d => ({ id: d.id, exists: d.exists(), data: () => d.data(), metadata: d.metadata });
    const qSnap = s => ({ docs: s.docs.map(snapDoc), size: s.size, empty: s.empty, metadata: s.metadata, docChanges: () => [] });
    function docRef(path){
      const r = fs.doc(fdb, path);
      return { id: r.id, path,
        async get(){ return snapDoc(await fs.getDoc(r)); },
        async set(data){ try { await fs.setDoc(r, data); } catch(e){ throw wrapErr(e); } },
        async update(data){ try { await fs.updateDoc(r, data); } catch(e){ throw wrapErr(e); } },
        async delete(){ try { await fs.deleteDoc(r); } catch(e){ throw wrapErr(e); } },
        onSnapshot(next, err){ return fs.onSnapshot(r, { includeMetadataChanges: true }, d => next(snapDoc(d)), e => err && err(wrapErr(e))); },
        collection(sub){ return colRef(path + "/" + sub); } };
    }
    function colRef(path){
      const r = fs.collection(fdb, path);
      return { path,
        doc(id){ return docRef(path + "/" + (id || fs.doc(r).id)); },
        async get(){ return qSnap(await fs.getDocs(r)); },
        async add(data){ const d = fs.doc(r); await fs.setDoc(d, data); return docRef(path + "/" + d.id); },
        onSnapshot(next, err){ return fs.onSnapshot(r, { includeMetadataChanges: true }, s => next(qSnap(s)), e => err && err(wrapErr(e))); } };
    }
    const dbNs = { doc: docRef, collection: colRef };
    const isAdmin = () => !!(auth.currentUser && CFG.adminEmail && (auth.currentUser.email || "").toLowerCase() === CFG.adminEmail.toLowerCase());
    const userNs = {
      id: async () => auth.currentUser ? auth.currentUser.uid : null,
      isOwner: async () => isAdmin(),
      canEdit: async () => isAdmin(),
      can: async () => null,
      me: async () => { const u = auth.currentUser; return { id: u ? u.uid : null, name: (u && u.displayName) || "", email: u ? u.email : null, avatarUrl: "", color: "#0E7A68", isOwner: isAdmin(), canEdit: isAdmin() }; },
      profiles: async ids => { const o = {}; const u = auth.currentUser; [].concat(ids).forEach(id => { o[id] = { id, name: u && id === u.uid ? (u.displayName || "") : "", avatarUrl: "", color: "#0E7A68", email: null, isMe: !!(u && id === u.uid), guest: false }; }); return o; }
    };

    /* ---- Pantalla de entrada ---- */
    const errTxt = e => {
      const c = (e && e.code) || "";
      if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "Correo o contraseña incorrectos.";
      if (c.includes("email-already-in-use")) return "Ese correo ya tiene cuenta. Toca “Entrar”.";
      if (c.includes("weak-password")) return "La contraseña necesita por lo menos 6 letras o números.";
      if (c.includes("invalid-email")) return "Revisa el correo, parece que tiene un error.";
      if (c.includes("network")) return "No hay internet. Revisa la conexión.";
      if (c.includes("too-many-requests")) return "Demasiados intentos. Espera unos minutos.";
      if (c.includes("popup-closed") || c.includes("cancelled-popup")) return "";
      if (c.includes("unauthorized-domain")) return "Falta autorizar esta página en Firebase (paso 4 del LEEME).";
      return "No se pudo entrar. Inténtalo otra vez.";
    };
    let loginMode = "entrar";
    const setMode = m => { loginMode = m; loginEl.querySelectorAll("[data-lmode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lmode === m))); q("#lg-name-row").hidden = m !== "crear"; q("#lg-go").textContent = m === "crear" ? "Crear mi cuenta" : "Entrar"; q("#lg-pass").autocomplete = m === "crear" ? "new-password" : "current-password"; q("#lg-err").textContent = ""; };
    const showLogin = () => { loginEl.hidden = false; setMode(loginMode); };
    loginEl.addEventListener("click", async ev => {
      const t = ev.target.closest("[data-lmode],[data-lact]"); if (!t) return;
      if (t.dataset.lmode) return setMode(t.dataset.lmode);
      const act = t.dataset.lact, err = q("#lg-err");
      if (act === "google"){ try { await authMod.signInWithPopup(auth, new authMod.GoogleAuthProvider()); } catch(e){ err.textContent = errTxt(e); } }
      if (act === "guest"){ lsSet("palomar.guest", "1"); loginEl.hidden = true; if (!resolved) done(null); }
      if (act === "reset"){ const em = q("#lg-email").value.trim(); if (!em){ err.textContent = "Escribe tu correo arriba y vuelve a tocar aquí."; return; } try { await authMod.sendPasswordResetEmail(auth, em); err.textContent = "Te mandamos un correo para cambiar la contraseña."; } catch(e){ err.textContent = errTxt(e); } }
      if (act === "close"){ loginEl.hidden = true; if (!resolved) done(null); }
    });
    q("#lg-form").addEventListener("submit", async ev => {
      ev.preventDefault();
      const em = q("#lg-email").value.trim(), pw = q("#lg-pass").value, err = q("#lg-err"), go = q("#lg-go");
      go.disabled = true; err.textContent = "";
      try {
        if (loginMode === "crear"){
          const cred = await authMod.createUserWithEmailAndPassword(auth, em, pw);
          const nm = q("#lg-name").value.trim(); if (nm) await authMod.updateProfile(cred.user, { displayName: nm });
        } else await authMod.signInWithEmailAndPassword(auth, em, pw);
      } catch(e){ err.textContent = errTxt(e); }
      go.disabled = false;
    });

    /* ---- Botón de cuenta ---- */
    const acctModal = q("#acct");
    acctBtn.addEventListener("click", () => {
      const u = auth.currentUser;
      if (!u){ lsSet("palomar.guest", null); showLogin(); return; }
      q("#acct-who").textContent = u.displayName ? `${u.displayName} · ${u.email || ""}` : (u.email || "Tu cuenta");
      acctModal.hidden = false;
    });
    acctModal.addEventListener("click", async ev => {
      const t = ev.target.closest("[data-aact]");
      if (ev.target === acctModal || (t && t.dataset.aact === "close")) acctModal.hidden = true;
      if (t && t.dataset.aact === "out"){ await authMod.signOut(auth); lsSet("palomar.guest", null); location.reload(); }
    });

    authMod.onAuthStateChanged(auth, u => {
      if (u){
        loginEl.hidden = true; acctBtn.classList.add("in");
        if (resolved && mode === "local") { location.reload(); return; }
        done({ db: dbNs, user: userNs });
      } else {
        acctBtn.classList.remove("in");
        if (lsGet("palomar.guest") === "1") done(null); else showLogin();
      }
    });
  } catch(e){
    console.warn("Firebase no cargó", e);
    if (acctBtn) acctBtn.hidden = true;
    done(null);
  }
}

</script>

  let keep = a, exp = b;
  if (depths(a).has(b)) { keep = b; exp = a; }
  const e = B(exp);
  const v = 0.5 * (phi(keep, e.padre, g+1) + phi(keep, e.madre, g+1));

}
function F(id, g){ const b = B(id); return b ? phi(b.padre, b.madre, g || 0) : 0; }
const pct = x => { const v = x * 100; return (v === 0 ? "0" : v < 1 ? v.toFixed(2) : (Math.round(v*10)/10).toString()) + "%"; };
function fLevel(f){
  if (f <= 0) return {cls:"lo", txt:"Sin consanguinidad"};
  if (f < 0.0625) return {cls:"lo", txt:"Baja"};
  if (f < 0.125) return {cls:"mid", txt:"Moderada"};
  if (f < 0.25) return {cls:"hi", txt:"Alta"};
  return {cls:"hi", txt:"Muy alta"};
}
const nm = b => b ? (b.nombre || b.anilla || "Sin nombre") : "Desconocido";
const W = (b, m, f) => (b && b.sexo === "H") ? f : m;
const plural = (a, b, m, f) => (a.sexo === "H" && b.sexo === "H") ? f : m;
function ancWord(d, b){
  const t = ["", W(b,"padre","madre"), W(b,"abuelo","abuela"), W(b,"bisabuelo","bisabuela"), W(b,"tatarabuelo","tatarabuela")];
  return t[d] || `${W(b,"ancestro","ancestra")} (${d} generaciones atrás)`;
}
function descWord(d, b){
  const t = ["", W(b,"hijo","hija"), W(b,"nieto","nieta"), W(b,"bisnieto","bisnieta"), W(b,"tataranieto","tataranieta")];
  return t[d] || `${W(b,"descendiente","descendiente")} (${d} generaciones)`;
}
function relation(a, b){
  const A = B(a), Bb = B(b);
  if (a === b) return {title:"Es la misma paloma", common:[]};
  const da = depths(a), db_ = depths(b);
  if (db_.has(a)) { const d = db_.get(a); return {title:`${nm(A)} es ${ancWord(d,A)} de ${nm(Bb)}`, sub:`${nm(Bb)} es ${descWord(d,Bb)} de ${nm(A)}.`, common:[a]}; }
  if (da.has(b)) { const d = da.get(b); return {title:`${nm(Bb)} es ${ancWord(d,Bb)} de ${nm(A)}`, sub:`${nm(A)} es ${descWord(d,A)} de ${nm(Bb)}.`, common:[b]}; }
  let best = null; const all = [];
  for (const [c, x] of da){ if (c === a || !db_.has(c)) continue; const y = db_.get(c); all.push({c,x,y}); if (!best || x+y < best.x+best.y) best = {c,x,y}; }
  if (!best) return {title:"Sin parentesco conocido", sub:"No tienen ningún ancestro en común registrado en tu palomar.", common:[]};
  const closest = all.filter(o => o.x + o.y === best.x + best.y).map(o => o.c);
  const {x, y} = best;
  if (x === 1 && y === 1){
    const sp = A.padre && A.padre === Bb.padre, sm = A.madre && A.madre === Bb.madre;
    if (sp && sm) return {title:`Son ${plural(A,Bb,"hermanos","hermanas")} completos`.replace("hermanas completos","hermanas completas"), sub:"Mismo padre y misma madre.", common:closest};
    return {title:`Son ${plural(A,Bb,"medio hermanos","medio hermanas")}`, sub:`Comparten solo ${sp ? "el padre" : "la madre"}: ${nm(B(sp ? A.padre : A.madre))}.`, common:closest};
  }
  if (x === 1 && y === 2) return {title:`${nm(A)} es ${W(A,"tío","tía")} de ${nm(Bb)}`, sub:`${nm(Bb)} es ${W(Bb,"sobrino","sobrina")} de ${nm(A)}.`, common:closest};
  if (x === 2 && y === 1) return {title:`${nm(Bb)} es ${W(Bb,"tío","tía")} de ${nm(A)}`, sub:`${nm(A)} es ${W(A,"sobrino","sobrina")} de ${nm(Bb)}.`, common:closest};
  if (x === 1 && y === 3) return {title:`${nm(A)} es ${W(A,"tío abuelo","tía abuela")} de ${nm(Bb)}`, common:closest};
  if (x === 3 && y === 1) return {title:`${nm(Bb)} es ${W(Bb,"tío abuelo","tía abuela")} de ${nm(A)}`, common:closest};
  if (x === y){
    const p = plural(A,Bb,"primos","primas");
    const g = {2:`${p} ${p==="primas"?"hermanas":"hermanos"}`, 3:`${p} ${p==="primas"?"segundas":"segundos"}`, 4:`${p} ${p==="primas"?"terceras":"terceros"}`}[x];
    if (g) return {title:`Son ${g}`, sub:"Sus " + (x===2?"padres":x===3?"abuelos":"bisabuelos") + " son hermanos.", common:closest};
  }
  return {title:"Son parientes lejanos", sub:`Su ancestro común más cercano está a ${x} y ${y} generaciones.`, common:closest};
}
function descendantsOf(id){ return Object.keys(S.birds).filter(x => depths(x).has(id)); }
function siblings(id){
  const b = B(id); if (!b) return {full:[], half:[]};
  const full = [], half = [];
  for (const o of Object.values(S.birds)){
    if (o.id === id) continue;
    const sp = b.padre && o.padre === b.padre, sm = b.madre && o.madre === b.madre;
    if (sp && sm) full.push(o); else if (sp || sm) half.push(o);
  }
  return {full, half};
}
const childrenOf = id => Object.values(S.birds).filter(o => o.padre === id || o.madre === id);
function raceSummary(b){
  const cs = (b && b.carreras) || [];
  if (!cs.length) return "";
  const withPos = cs.filter(c => +c.puesto > 0);
  let best = "";
  if (withPos.length){ const m = withPos.reduce((a,c) => +c.puesto < +a.puesto ? c : a); best = ` · mejor ${m.puesto}º${m.total ? " de " + m.total : ""}${m.suelta ? " en " + m.suelta : ""}`; }
  return `${cs.length} carrera${cs.length>1?"s":""}${best}`;
}
const capSummary = b => { const n = ((b && b.capturas) || []).length; return n ? `${n} captura${n>1?"s":""}` : ""; };

const NID_ESTADOS = ["Incubando","Nacieron","Anillados","Destetados","Perdida"];
function nidFechas(n){
  const eclosion = n.nacio || addDays(n.puesta, 19);
  return {eclosion, anillarDe:addDays(eclosion,5), anillarA:addDays(eclosion,7), destete:addDays(eclosion,28)};
}
function agenda(){
  const items = [], t = todayISO();
  for (const n of S.cria.nidadas || []){
    if (!n.puesta) continue;
    const f = nidFechas(n), par = `${nm(B(n.macho))} × ${nm(B(n.hembra))}`;
    if (n.estado === "Incubando") items.push({fecha:f.eclosion, t:"Deben nacer los pichones", s:par, nid:n.id});
    if (n.estado === "Incubando" || n.estado === "Nacieron") items.push({fecha:f.anillarDe, t:`Anillar pichones (hasta el ${fmtDay(f.anillarA)})`, s:par, nid:n.id});
    if (["Incubando","Nacieron","Anillados"].includes(n.estado)) items.push({fecha:f.destete, t:"Destetar pichones", s:par, nid:n.id});
  }
  const groups = {};
  for (const b of Object.values(S.birds)){
    if (b.estado && b.estado !== "En el palomar") continue;
    const latest = {};
    for (const h of b.salud || []){ const k = (h.producto||"").toLowerCase(); if (!latest[k] || (h.fecha||"") > (latest[k].fecha||"")) latest[k] = h; }
    for (const h of Object.values(latest)) if (h.proxima){ const k = h.proxima + "|" + h.tipo + "|" + h.producto; (groups[k] = groups[k] || {fecha:h.proxima, t:`${h.tipo}: ${h.producto}`, birds:[]}).birds.push(b); }
  }
  for (const g of Object.values(groups)) items.push({fecha:g.fecha, t:g.t, s:g.birds.length > 3 ? `${g.birds.length} palomas` : g.birds.map(nm).join(", "), bird:g.birds.length===1?g.birds[0].id:null});
  return items.filter(i => daysFrom(i.fecha) <= 30 && daysFrom(i.fecha) >= -21).sort((a,b) => a.fecha.localeCompare(b.fecha));
}
function nestCard(n){
  const M = B(n.macho), H = B(n.hembra), f = n.puesta ? nidFechas(n) : null, fo = phi(n.macho, n.hembra), lv = fLevel(fo);

  return `<article class="nest">
    <div class="row" style="justify-content:space-between"><div class="row" style="gap:8px"><span class="tag">${esc(n.estado)}</span>${fo>0?`<span class="pill ${lv.cls}">Pichones ${pct(fo)} consang.</span>`:""}</div><button class="btn sm" data-act="editNid" data-id="${esc(n.id)}">Editar</button></div>
    <h3 style="font-size:22px;margin-top:8px"><button class="linkbtn" data-act="open" data-id="${esc(n.macho)}">${esc(nm(M))}</button> <span class="meta">♂ ×</span> <button class="linkbtn" data-act="open" data-id="${esc(n.hembra)}">${esc(nm(H))}</button> <span class="meta">♀</span></h3>
    ${f && n.estado !== "Perdida" ? `<div class="steps">${step(0,"Puesta",n.puesta)}${step(1,"Nacen",f.eclosion)}${step(2,"Anillar",f.anillarDe)}${step(3,"Destete",f.destete)}</div>` : ""}
    <p class="meta" style="margin:8px 0 0">${esc(n.huevos||2)} huevo${(n.huevos||2)==1?"":"s"}${n.nota?` · ${esc(n.nota)}`:""}</p>
    ${kids.length ? `<p style="margin:6px 0 0">${kids.map(k => `<button class="btn sm" style="margin:2px 6px 0 0" data-act="open" data-id="${esc(k.id)}">${esc(k.anilla||nm(k))}</button>`).join("")}</p>` : ""}

/* ---------- Ranking ---------- */
const racePts = c => (+c.puesto > 0 && +c.total > 0) ? Math.max(0, Math.round(100 * (+c.total - +c.puesto + 1) / +c.total)) : (+c.puesto > 0 ? Math.max(0, 50 - +c.puesto) : 0);
function inYear(fecha){ if (S.ryear === "todos") return true; return String(fecha||"").slice(0,4) === S.ryear; }
function flyerStats(b){
  const cs = (b.carreras||[]).filter(c => inYear(c.fecha));
  if (!cs.length) return null;
  const pts = cs.reduce((a,c) => a + racePts(c), 0);
  const pos = cs.filter(c => +c.puesto > 0).map(c => +c.puesto);
  const vel = cs.filter(c => +c.vel > 0).map(c => +c.vel);
  return {b, n:cs.length, pts, avg:Math.round(pts/cs.length), best:pos.length?Math.min(...pos):null, top10:pos.filter(p => p<=10).length, vel:vel.length?Math.max(...vel):null};
}
function viewRanking(){
  const years = [...new Set(Object.values(S.birds).flatMap(b => [...(b.carreras||[]), ...(b.capturas||[])].map(x => String(x.fecha||"").slice(0,4))).filter(Boolean))].sort().reverse();
  const tabs = [["voladores","Voladores"],["reproductores","Reproductores"],["buchones","Buchones"]].map(([k,t]) => `<button aria-current="${S.rtab===k}" data-act="rtab" data-v="${k}">${t}</button>`).join("");
  const ychips = ["todos", ...years].map(y => `<button class="chip" aria-pressed="${S.ryear===y}" data-act="ryear" data-v="${y}">${y==="todos"?"Todos los años":y}</button>`).join("");
  const link = b => `<button class="linkbtn" data-act="open" data-id="${esc(b.id)}">${esc(nm(b))}</button> <span class="band">${esc(b.anilla||"")}</span>`;
  let body = "";
  if (S.rtab === "voladores"){
    const L = Object.values(S.birds).map(flyerStats).filter(Boolean).sort((a,b) => b.pts - a.pts || b.avg - a.avg);
    body = `<p class="meta">Puntos por carrera: 100 si llega 1ª, y bajan según el puesto y cuántas palomas volaron. Ganar contra 100 vale más que ganar contra 10.</p>` +
      (L.length ? `<div class="tablewrap rank"><table><thead><tr><th>#</th><th>Paloma</th><th style="text-align:right">Puntos</th><th style="text-align:right">Carreras</th><th style="text-align:right">Promedio</th><th style="text-align:right">Mejor</th><th style="text-align:right">Top 10</th><th style="text-align:right">Vel. máx</th></tr></thead><tbody>${L.map((r,i) => `<tr><td>${i+1}</td><td>${link(r.b)}</td><td class="num"><b>${r.pts}</b></td><td class="num">${r.n}</td><td class="num">${r.avg}</td><td class="num ${r.best===1?"pos1":""}">${r.best?r.best+"º":"—"}</td><td class="num">${r.top10}</td><td class="num">${r.vel?r.vel+" m/min":"—"}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">No hay carreras anotadas${S.ryear!=="todos"?" en "+S.ryear:""}.</div>`);
  } else if (S.rtab === "reproductores"){
    const L = Object.values(S.birds).map(b => {
      const kids = childrenOf(b.id); if (!kids.length) return null;
      const st = kids.map(flyerStats).filter(Boolean);
      const pts = st.reduce((a,s) => a + s.pts, 0);
      const best = st.filter(s => s.best).sort((a,c) => a.best - c.best)[0];
      return {b, kids:kids.length, voladores:st.length, pts, best, caps:kids.reduce((a,k) => a + (k.capturas||[]).filter(c => inYear(c.fecha)).length, 0)};
    }).filter(Boolean).sort((a,b) => b.pts - a.pts || b.caps - a.caps || b.kids - a.kids);
    body = `<p class="meta">Los mejores padres y madres según lo que han hecho sus hijos en las carreras.</p>` +
      (L.length ? `<div class="tablewrap rank"><table><thead><tr><th>#</th><th>Reproductor</th><th style="text-align:right">Hijos</th><th style="text-align:right">Hijos con carreras</th><th style="text-align:right">Puntos de los hijos</th><th>Mejor hijo</th><th style="text-align:right">Capturas de hijos</th></tr></thead><tbody>${L.map((r,i) => `<tr><td>${i+1}</td><td>${link(r.b)} <span class="sx ${r.b.sexo}">${r.b.sexo==="M"?"♂":r.b.sexo==="H"?"♀":""}</span></td><td class="num">${r.kids}</td><td class="num">${r.voladores}</td><td class="num"><b>${r.pts}</b></td><td>${r.best?`${esc(nm(r.best.b))} · ${r.best.best}º`:"—"}</td><td class="num">${r.caps}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Todavía no hay palomas con hijos registrados.</div>`);
  } else {
    const L = Object.values(S.birds).map(b => { const cs = (b.capturas||[]).filter(c => inYear(c.fecha)); if (!cs.length) return null; const quedo = cs.filter(c => /qued/i.test(c.nota||"")).length; const last = cs.map(c => c.fecha||"").sort().pop(); return {b, n:cs.length, quedo, last}; })
      .filter(Boolean).sort((a,b) => b.n - a.n || b.quedo - a.quedo);
    body = (L.length ? `<div class="tablewrap rank"><table><thead><tr><th>#</th><th>Ejemplar</th><th style="text-align:right">Capturas</th><th style="text-align:right">Se quedaron</th><th>Última</th></tr></thead><tbody>${L.map((r,i) => `<tr><td>${i+1}</td><td>${link(r.b)}</td><td class="num"><b>${r.n}</b></td><td class="num">${r.quedo}</td><td>${esc(r.last)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">No hay capturas anotadas${S.ryear!=="todos"?" en "+S.ryear:""}.</div>`);
  }
  return `${noticeHtml()}<h2 style="font-size:30px">Ranking del palomar</h2>
  <nav class="subtabs" style="margin-top:8px">${tabs}</nav>
  <div class="chips" style="margin:12px 0">${ychips}</div>${body}`;
}

/* ---------- Comunidad: mercado, foro, perfiles ---------- */
const CATS = ["General","Carreras","Cría y pedigree","Salud","Capturas","Buchones"];
const fmtDate = t => { try { return new Date(t).toLocaleDateString("es", {day:"numeric", month:"short", year:"numeric"}); } catch(e){ return ""; } };
function perfil(id){ return S.raw.perfiles[id] || {}; }
function whoName(id){ const p = perfil(id); return p.palomar || S.names[id] || "Palomero"; }
function whoHtml(id, t){
  const p = perfil(id);
  return `<div class="who"><b style="color:var(--ink)">${esc(whoName(id))}</b>${p.ciudad?` · ${esc(p.ciudad)}`:""}${t?` · ${fmtDate(t)}`:""}${id===uid?' · <span class="pill mut">Tú</span>':""}</div>`;
}
let namesPending = false;
function refreshNames(){
  if (!userNs || namesPending) return;
  const ids = new Set([...Object.keys(S.raw.mercado), ...Object.keys(S.raw.foro), ...Object.keys(S.raw.perfiles)]);
  if (!ids.size) return;
  namesPending = true;
  userNs.profiles([...ids]).then(ps => { namesPending = false; let ch = false; for (const k in ps){ if (ps[k].name && S.names[k] !== ps[k].name){ S.names[k] = ps[k].name; ch = true; } } if (ch) render(); }).catch(() => { namesPending = false; });
}
async function writeMine(colName, data){
  try { await db.doc(colName + "/" + uid).set(data); return true; }
  catch(e){ toast(e && e.code === "invalid_argument" ? "Tu acceso es solo para ver. Pide al dueño que te dé permiso para participar." : errMsg(e)); return false; }
}
async function writeOther(colName, owner, data){
  try { await db.doc(colName + "/" + owner).set(data); return true; } catch(e){ toast(errMsg(e)); return false; }
}
function communityGate(){
  if (S.community) return "";
  return `<div class="empty"><h3>El mercado y el foro necesitan tu cuenta</h3><p>Entra con tu cuenta (botón de la persona, arriba) para ver los anuncios y conversar con otros palomeros.</p></div>`;
}
function myProfileBar(){
  const p = perfil(uid);

function allAds(){
  const L = [];

  return L.sort((a,b) => (b.fecha||0) - (a.fecha||0));
}
function viewMercado(){
  const gate = communityGate(); if (gate) return gate;
  const chips = [["todos","Todo"],["Vendo","Se vende"],["Compro","Se compra"],["Cambio","Cambio"],["mios","Mis anuncios"]]

    const mine = a.owner === uid;
    return `<article class="ad ${a.vendida?"sold":""}">

      <div class="bd">

        <h3 style="font-size:22px">${esc(a.titulo)}</h3>
        ${a.precio ? `<div class="price">${esc(a.precio)}</div>` : ""}
        <div class="meta">${esc([a.raza, a.sexo, a.color, a.ubicacion].filter(Boolean).join(" · "))}</div>
        ${a.pedigree ? `<div class="ped-txt"><b>Pedigree:</b> ${esc(a.pedigree)}</div>` : ""}
        ${a.desc ? `<div class="body-txt" style="font-size:14px">${esc(a.desc)}</div>` : ""}
        ${whoHtml(a.owner, a.fecha)}
        ${(a.contacto || perfil(a.owner).telefono) ? `<div class="contact"><span>${esc(a.contacto || perfil(a.owner).telefono)}</span><button class="btn sm" data-act="copy" data-v="${esc(a.contacto || perfil(a.owner).telefono)}">Copiar</button></div>` : ""}
        <div class="row" style="margin-top:auto;padding-top:6px">
          ${mine ? `<button class="btn sm" data-act="editAd" data-id="${esc(a.id)}">Editar</button><button class="btn sm" data-act="soldAd" data-id="${esc(a.id)}">${a.vendida?"Volver a publicar":"Marcar vendida"}</button>` : ""}

  <div class="chips" style="margin-top:10px">${chips}</div>
  ${L.length ? `<div class="mgrid">${cards}</div>` : `<div class="empty" style="margin-top:14px"><h3>${S.mfilter==="mios"?"No tienes anuncios":"Todavía no hay anuncios"}</h3><p>Publica una paloma para vender, cambiar, o di qué estás buscando. Si la vendes de tu palomar, el pedigree se agrega solo.</p><button class="btn pri" data-act="newAd">+ Publicar anuncio</button></div>`}`;

function pedigreeText(b){
  const part = (lbl, x) => x ? `${lbl}: ${nm(x)}${raceSummary(x) ? " (" + raceSummary(x) + ")" : ""}` : "";
  return [part("Padre", B(b.padre)), part("Madre", B(b.madre)), raceSummary(b) ? "Ella/él: " + raceSummary(b) : "", F(b.id) > 0 ? "Consanguinidad " + pct(F(b.id)) : ""].filter(Boolean).join(" · ").replace("Ella/él", b.sexo==="H"?"Ella":"Él");
}

function forumData(){
  const posts = [], replies = {};
  for (const [owner, d] of Object.entries(S.raw.foro)){
    (d.posts || []).forEach(p => posts.push(Object.assign({owner}, p)));
    (d.replies || []).forEach(r => { (replies[r.postId] = replies[r.postId] || []).push(Object.assign({owner}, r)); });
  }
  Object.values(replies).forEach(l => l.sort((a,b) => (a.fecha||0) - (b.fecha||0)));
  const last = p => Math.max(p.fecha || 0, ...((replies[p.id] || []).map(r => r.fecha || 0)));
  posts.sort((a,b) => last(b) - last(a));
  return {posts, replies};
}
function viewForo(){
  const gate = communityGate(); if (gate) return gate;

  <div class="chips" style="margin-top:10px">${cats}</div>
  ${L.length ? `<div class="list" style="margin-top:14px">${L.map(p => `<button class="post" data-act="thread" data-id="${esc(p.id)}"><div class="row" style="gap:8px"><span class="tag">${esc(p.cat||"General")}</span><span class="meta">${(replies[p.id]||[]).length} respuestas</span></div><h3 style="margin:6px 0 4px">${esc(p.titulo)}</h3><div class="meta" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(p.texto)}</div><div style="margin-top:6px">${whoHtml(p.owner, p.fecha)}</div></button>`).join("")}</div>`
    : `<div class="empty" style="margin-top:14px"><h3>Todavía no hay temas</h3><p>Abre el primero: cuenta una carrera, pregunta por un cruce o presenta tu palomar.</p><button class="btn pri" data-act="newPost">+ Nuevo tema</button></div>`}`;
}

let downloadsNs = null;
function pedGens(id){
  const gens = [[id]];
  for (let g = 1; g < 4; g++){ const cur = []; for (const x of gens[g-1]){ const b = B(x); cur.push(b && B(b.padre) ? b.padre : null, b && B(b.madre) ? b.madre : null); } gens.push(cur); }
  return gens;
}
const REL = [["Ejemplar"],["Padre","Madre"],["Abuelo paterno","Abuela paterna","Abuelo materno","Abuela materna"],
  ["Bisabuelo","Bisabuela","Bisabuelo","Bisabuela","Bisabuelo","Bisabuela","Bisabuelo","Bisabuela"]];
function pedigreeTextFull(id){
  const gens = pedGens(id), b = B(id);
  const line = (x, lbl, ind) => { const o = B(x); if (!o) return `${ind}${lbl}: ${/a( |$)/.test(lbl.toLowerCase()) || lbl==="MADRE" ? "desconocida" : "desconocido"}`; const r = [raceSummary(o), capSummary(o)].filter(Boolean).join(" · "); return `${ind}${lbl}: ${nm(o)} (${o.anilla||"sin anilla"})${o.color?" · "+o.color:""}${r?"\n"+ind+"   "+r:""}`; };
  const out = [`🕊️ PEDIGREE — ${nm(b)} (${b.anilla||"sin anilla"})`,
    [b.sexo==="M"?"Macho":b.sexo==="H"?"Hembra":"Sin sexar", b.color, b.anio, b.raza].filter(Boolean).join(" · ")];
  const r0 = [raceSummary(b), capSummary(b)].filter(Boolean).join(" · "); if (r0) out.push("Resultados: " + r0);
  if (F(id) > 0) out.push("Consanguinidad: " + pct(F(id)));
  out.push("");
  [[0,"PADRE"],[1,"MADRE"]].forEach(([i, lbl]) => {
    out.push(line(gens[1][i], lbl, ""));
    out.push(line(gens[2][i*2], i?"Abuelo materno":"Abuelo paterno", "   "));
    out.push(line(gens[2][i*2+1], i?"Abuela materna":"Abuela paterna", "   "));
    out.push("");
  });
  const p = perfil(uid); if (p.palomar) out.push(`${p.palomar}${p.telefono?" · "+p.telefono:""}`);
  return out.join("\n").trim();
}
function fitText(ctx, t, w){ t = String(t||""); if (ctx.measureText(t).width <= w) return t; while (t.length && ctx.measureText(t + "…").width > w) t = t.slice(0,-1); return t + "…"; }

async function pedigreeImage(id){

  x.fillStyle = C.slate; x.fillRect(0,0,W_,232); const gr = x.createLinearGradient(0,0,W_,0); gr.addColorStop(0,"#13A58B"); gr.addColorStop(.48,"#2C83B9"); gr.addColorStop(1,"#7B44B8"); x.fillStyle = gr; x.fillRect(0,232,W_,8);

  x.fillStyle = "#F3F6FA"; x.font = `900 78px ${DISP}`; x.fillText(fitText(x, b.nombre || b.anilla || "Sin nombre", 980), 48, 148);
  x.font = `600 28px ${MONO}`; const bt = b.anilla || "—", bw = x.measureText(bt).width + 32;
  x.fillStyle = C.band; rrect(x, 48, 168, bw, 46, 23); x.fill(); x.fillStyle = "#2A1E05"; x.fillText(bt, 64, 201);
  x.fillStyle = "#D5DDE8"; x.font = `500 26px ${BODY}`;
  const info = [b.sexo==="M"?"Macho":b.sexo==="H"?"Hembra":"Sin sexar", b.color, b.anio, b.raza, F(id)>0?"Consang. "+pct(F(id)):""].filter(Boolean).join(" · ");
  x.fillText(fitText(x, info, 1000 - bw - 24), 48 + bw + 20, 201);
  const top = 262, bottom = 1250, rowH = (bottom - top) / 8, colW = 238, gap = 20;
  gens.forEach((row, g) => {
    const span = 8 / Math.pow(2, g);
    row.forEach((bid, i) => {
      const o = B(bid), cx = 40 + g * (colW + gap), cy = top + (i * span + span / 2) * rowH;
      const h = g === 3 ? rowH - 10 : Math.min(rowH * span - 16, 170), y0 = cy - h/2;
      if (g > 0){ x.strokeStyle = C.line; x.lineWidth = 2; x.beginPath(); x.moveTo(cx - gap, cy); x.lineTo(cx, cy); x.stroke(); }
      if (g < 3){ const ch = span / 2; const y1 = top + (i*span + ch/2) * rowH, y2 = top + (i*span + span - ch/2) * rowH; x.strokeStyle = C.line; x.lineWidth = 2; x.beginPath(); x.moveTo(cx + colW + gap/2, y1); x.lineTo(cx + colW + gap/2, y2); x.moveTo(cx + colW, cy); x.lineTo(cx + colW + gap/2, cy); x.stroke(); }
      x.fillStyle = o ? C.card : "rgba(255,255,255,.45)"; rrect(x, cx, y0, colW, h, 12); x.fill();
      x.strokeStyle = C.line; x.lineWidth = 1.5; x.stroke();
      x.fillStyle = !o ? C.line : o.sexo === "M" ? C.acc : o.sexo === "H" ? C.sheen : C.muted; x.fillRect(cx, y0 + 8, 6, h - 16);
      const tx = cx + 18, tw = colW - 28; let ty = y0 + 28;

      if (!o){ x.font = `500 20px ${BODY}`; x.fillText(i % 2 && g > 0 ? "Desconocida" : "Desconocido", tx, ty + 30); return; }
      ty += 32; x.fillStyle = C.ink; x.font = `700 ${g===3?24:28}px ${DISP}`; x.fillText(fitText(x, o.nombre || "Sin nombre", tw), tx, ty);
      ty += 26; x.font = `600 16px ${MONO}`; x.fillStyle = C.ink; x.fillText(fitText(x, o.anilla || "—", tw), tx, ty);
      const res = [raceSummary(o), capSummary(o)].filter(Boolean).join(" · ");
      x.font = `500 15px ${BODY}`; x.fillStyle = C.muted;
      if (g === 3){ if (res && ty + 22 < y0 + h) x.fillText(fitText(x, res, tw), tx, ty + 22); return; }
      if (o.color){ ty += 24; x.fillText(fitText(x, o.color, tw), tx, ty); }

    });
  });
  const p = perfil(uid);
  x.fillStyle = C.muted; x.font = `500 22px ${BODY}`;
  x.fillText(fitText(x, p.palomar ? `${p.palomar}${p.telefono ? " · " + p.telefono : ""}${p.ciudad ? " · " + p.ciudad : ""}` : "Mi Palomar", 760), 48, 1305);
  x.textAlign = "right"; x.fillText(new Date().toLocaleDateString("es"), W_ - 48, 1305); x.textAlign = "left";
  return new Promise(res => c.toBlob(bl => res({blob:bl, url:c.toDataURL("image/png")}), "image/png"));
}

function birdOptions(sel, filterFn, emptyLabel){
  const L = Object.values(S.birds).filter(filterFn || (() => true)).sort((a,b) => nm(a).localeCompare(nm(b)));
  return `<option value="">${emptyLabel}</option>` + L.map(b => `<option value="${esc(b.id)}" ${b.id===sel?"selected":""}>${esc(b.nombre ? b.nombre + " — " + (b.anilla||"") : (b.anilla||"Sin nombre"))}</option>`).join("");
}
function viewPedigree(){
  const ids = Object.keys(S.birds);
  if (!ids.length) return `${noticeHtml()}<div class="empty"><h3>Sin palomas todavía</h3><p>Agrega palomas con su padre y su madre para ver el pedigree.</p></div>`;
  if (!S.pedId || !B(S.pedId)) S.pedId = (S.sel && B(S.sel)) ? S.sel : (Object.values(S.birds).find(b => b.padre || b.madre) || B(ids[0])).id;
  const gens = [[S.pedId]];
  for (let g = 1; g < 4; g++){ const cur = []; for (const x of gens[g-1]){ const b = B(x); cur.push(b && B(b.padre) ? b.padre : null, b && B(b.madre) ? b.madre : null); } gens.push(cur); }
  const count = {}; gens.slice(1).flat().forEach(x => { if (x) count[x] = (count[x]||0) + 1; });
  const dupIds = Object.keys(count).filter(k => count[k] > 1); const dupMark = {}; dupIds.forEach((k,i) => dupMark[k] = String.fromCharCode(65+i));
  const relLabel = (g, i) => {
    if (g === 0) return "Ejemplar";
    const side = i % 2 === 0 ? 0 : 1;
    if (g === 1) return side ? "Madre" : "Padre";
    const path = []; let idx = i; for (let k = g; k >= 1; k--){ path.unshift(idx % 2 ? "M" : "P"); idx = Math.floor(idx/2); }
    const word = g === 2 ? (side ? "Abuela" : "Abuelo") : (side ? "Bisabuela" : "Bisabuelo");
    return `${word} ${path[0]==="P" ? "paterno" : "materno"}`.replace(/(a) paterno$/, "$1 paterna").replace(/(a) materno$/, "$1 materna");
  };
  let cells = "";
  gens.forEach((row, g) => {
    const span = 8 / Math.pow(2, g);
    row.forEach((id, i) => {
      const style = `grid-column:${g+1};grid-row:${i*span+1} / span ${span}`;
      const b = B(id);
      if (!b){ cells += `<div class="pbox unk" style="${style}"><div class="rel">${relLabel(g,i)}</div><div>Desconocido</div></div>`; return; }
      const res = [raceSummary(b), capSummary(b)].filter(Boolean).join(" · ");
      cells += `<button class="pbox ${b.sexo} ${g===0?"root":""}" style="${style}" data-act="${g===0?"open":"ped"}" data-id="${esc(b.id)}">
        ${dupMark[id] ? `<span class="dup" title="Aparece ${count[id]} veces">${dupMark[id]}</span>` : ""}
        ${b.foto ? `<img class="pfoto" src="${esc(b.foto)}" alt="">` : ""}<div class="rel">${relLabel(g,i)}</div><div class="nm">${esc(b.nombre||"Sin nombre")}</div>
        <div><span class="band">${esc(b.anilla||"—")}</span> <span class="meta">${esc(b.color||"")}</span></div>
        ${res ? `<div class="res">${esc(res)}</div>` : ""}</button>`;
    });
  });
  const f = F(S.pedId), lv = fLevel(f);
  return `${noticeHtml()}
  <div class="row"><label class="lbl" for="pedSel">Ejemplar</label><select id="pedSel" class="search" style="flex:0 1 360px">${birdOptions(S.pedId, null, "Elige una paloma")}</select>
    <span class="pill ${lv.cls}">Consanguinidad ${pct(f)}</span><button class="btn sm pri" data-act="share" data-id="${esc(S.pedId)}">Compartir pedigree</button></div>
  ${dupIds.length ? `<div class="notice plain" style="margin-top:12px">Línea cerrada: ${dupIds.map(k => `<b>${dupMark[k]}</b> ${esc(nm(B(k)))} aparece ${count[k]} veces`).join(" · ")}.</div>` : ""}
  <p class="meta">Toca un ancestro para ver su propio pedigree. Toca el ejemplar para abrir su ficha.</p>
  <div class="pedwrap"><div class="ped">${cells}</div></div>`;
}
function viewParentesco(){
  const ids = Object.keys(S.birds);
  if (ids.length < 2) return `${noticeHtml()}<div class="empty"><h3>Necesitas al menos 2 palomas</h3><p>Aquí comparas dos palomas y la app te dice si son hermanos, primos, tío y sobrino, y cuánta consanguinidad tendrían sus pichones.</p></div>`;
  let res = "";
  if (S.relA && S.relB && B(S.relA) && B(S.relB)){
    const A = B(S.relA), Bb = B(S.relB), r = relation(S.relA, S.relB);
    const shared = Math.min(1, 2 * phi(S.relA, S.relB));
    const canBreed = A.sexo !== Bb.sexo || A.sexo === "?";
    const fo = phi(S.relA, S.relB), lv = fLevel(fo);
    res = `<div class="panel result"><div class="lbl">Parentesco</div><h3 style="margin-top:4px">${esc(r.title)}</h3>${r.sub?`<p class="meta" style="margin:6px 0 0">${esc(r.sub)}</p>`:""}
      ${r.common && r.common.length && S.relA!==S.relB ? `<p style="margin:10px 0 0"><span class="lbl">Ancestro común más cercano</span><br>${r.common.map(c => `<button class="btn sm" style="margin:4px 6px 0 0" data-act="open" data-id="${esc(c)}">${esc(nm(B(c)))}</button>`).join("")}</p>` : ""}
      <div class="twocol">
        <div class="panel" style="background:var(--surface-2)"><div class="lbl">Sangre en común</div><div class="big" style="margin-top:4px">${pct(shared)}</div><div class="meter"><i style="width:${Math.min(100,shared*100)}%"></i></div></div>
        ${canBreed && S.relA!==S.relB ? `<div class="panel" style="background:var(--surface-2)"><div class="lbl">Si los cruzas, el pichón tendría</div><div class="row" style="margin-top:4px"><span class="big">${pct(fo)}</span><span class="pill ${lv.cls}">${lv.txt}</span></div><p class="meta" style="margin:6px 0 0">de consanguinidad. ${fo>=0.125?"Es un cruce de sangre cerrado: fija la línea, pero sube el riesgo de pichones débiles.":fo>0?"Cruce de línea suave.":"Cruce abierto, sangre nueva."}</p></div>`
        : `<div class="panel" style="background:var(--surface-2)"><div class="lbl">Cruce</div><p class="meta" style="margin:4px 0 0">Son del mismo sexo, no se pueden cruzar entre sí.</p></div>`}
      </div></div>`;
  }
  return `${noticeHtml()}
  <div class="panel"><h2 style="font-size:26px">Comparar dos palomas</h2><p class="meta" style="margin:4px 0 12px">Elige dos ejemplares. La app busca sus ancestros comunes y calcula el parentesco.</p>
  <div class="relgrid"><label class="lbl" style="display:flex;flex-direction:column;gap:4px">Paloma 1<select id="relA" class="search">${birdOptions(S.relA, null, "Elige…")}</select></label>
  <label class="lbl" style="display:flex;flex-direction:column;gap:4px">Paloma 2<select id="relB" class="search">${birdOptions(S.relB, null, "Elige…")}</select></label></div></div>
  ${res}`;
}
function render(){
  if (!S.ready) return;
  const grp = {palomar:"palomar", ficha:"palomar", pedigree:"pedigree", parentesco:"pedigree", cria:"cria", ranking:"ranking", mercado:"comunidad", foro:"comunidad"}[S.view];
  document.querySelectorAll("[data-nav]").forEach(b => b.setAttribute("aria-current", String(b.dataset.nav === grp)));
  const html = S.view === "cria" ? viewCria() : S.view === "ranking" ? viewRanking() : S.view === "mercado" ? viewMercado() : S.view === "foro" ? viewForo() : S.view === "ficha" ? viewFicha() : S.view === "pedigree" ? viewPedigree() : S.view === "parentesco" ? viewParentesco() : viewPalomar();
  const sw = (opts) => `<nav class="subtabs" style="margin:0 0 16px">${opts.map(([v,t]) => `<button aria-current="${S.view===v}" data-act="view" data-v="${v}">${t}</button>`).join("")}</nav>`;
  let pre = "";
  if (grp === "pedigree") pre = sw([["pedigree","Árbol (pedigree)"],["parentesco","¿Son parientes?"]]);
  if (grp === "comunidad") pre = sw([["mercado","Compra y venta"],["foro","Foro"]]);
  const ae = document.activeElement, fid = ae && ae.id && ["q","mq","replyText"].includes(ae.id) ? ae.id : null;
  const pos = fid ? ae.selectionStart : null;
  const kept = {}; document.querySelectorAll("#app [data-keep]").forEach(el => kept[el.id] = el.value);
  $("#app").innerHTML = pre + html;
  for (const k in kept){ const el = document.getElementById(k); if (el) el.value = kept[k]; }
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus(); try { el.setSelectionRange(pos,pos); } catch(e){} } }
}

function resizeImg(file, maxSize){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const max = maxSize || 480, s = Math.min(1, max / Math.max(img.width, img.height));
