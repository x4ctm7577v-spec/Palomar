      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", 0.72)); };
      img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function carreraForm(c){
  const b = B(S.sel); const isNew = !c; c = c || {fecha:new Date().toISOString().slice(0,10)};
  openModal(`<h2>${isNew ? "Nueva carrera" : "Editar carrera"} · ${esc(nm(b))}</h2>
  <form class="form" autocomplete="off">
    <label>Fecha<input id="c-fecha" name="fecha" type="date" required value="${esc(c.fecha)}"></label>
    <label>Suelta (lugar)<input id="c-suelta" name="suelta" value="${esc(c.suelta)}" placeholder="Ocala"></label>
    <label>Distancia (km)<input id="c-km" name="km" type="number" step="any" inputmode="decimal" value="${esc(c.km)}"></label>
    <label>Velocidad (m/min)<input id="c-vel" name="vel" type="number" step="any" inputmode="decimal" value="${esc(c.vel)}"></label>
    <label>Puesto<input id="c-puesto" name="puesto" type="number" min="1" inputmode="numeric" value="${esc(c.puesto)}"></label>
    <label>De cuántas palomas<input id="c-total" name="total" type="number" min="1" inputmode="numeric" value="${esc(c.total)}"></label>
    <label class="full">Nota<textarea id="c-nota" name="nota" placeholder="Clima, hora de llegada, cómo llegó…">${esc(c.nota)}</textarea></label>
    <div class="full mfoot" style="justify-content:space-between"><div>${isNew?"":`<button type="button" class="btn danger" data-act="delCarrera" data-cid="${esc(c.id)}">Borrar</button>`}</div>
    <div class="row"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn pri">Guardar</button></div></div>
  </form>`, async fd => {
    const n = {id:c.id||newId()}; ["fecha","suelta","km","vel","puesto","total","nota"].forEach(k => n[k] = String(fd.get(k)||"").trim());
    ["km","vel","puesto","total"].forEach(k => n[k] = n[k] === "" ? "" : +n[k]);
    const nb = Object.assign({}, b, {carreras:(b.carreras||[]).filter(x => x.id !== n.id).concat(n)});
    closeModal(); S.ftab = "carreras"; await saveBird(nb); toast("Carrera guardada");
  });
}
function capturaForm(k){
  const b = B(S.sel); const isNew = !k; k = k || {fecha:new Date().toISOString().slice(0,10)};
  openModal(`<h2>${isNew ? "Nueva captura" : "Editar captura"} · ${esc(nm(b))}</h2>
  <form class="form" autocomplete="off">
    <label>Fecha<input id="k-fecha" name="fecha" type="date" required value="${esc(k.fecha)}"></label>
    <label>Anilla de la capturada<input id="k-capturada" name="capturada" value="${esc(k.capturada)}" placeholder="O “Sin anilla”"></label>
    <label>Color<input id="k-color" name="color" value="${esc(k.color)}"></label>
    <label>De quién era<input id="k-dueno" name="dueno" value="${esc(k.dueno)}" placeholder="Vecino, palomar…"></label>
    <label class="full">Qué pasó<input id="k-nota" name="nota" list="kres" value="${esc(k.nota)}" placeholder="Se quedó, devuelta, rescate…"><datalist id="kres"><option>Se quedó</option><option>Devuelta</option><option>Rescate pagado</option><option>Cambiada</option></datalist></label>
    <div class="full mfoot" style="justify-content:space-between"><div>${isNew?"":`<button type="button" class="btn danger" data-act="delCaptura" data-cid="${esc(k.id)}">Borrar</button>`}</div>
    <div class="row"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn pri">Guardar</button></div></div>
  </form>`, async fd => {
    const n = {id:k.id||newId()}; ["fecha","capturada","color","dueno","nota"].forEach(f => n[f] = String(fd.get(f)||"").trim());
    const nb = Object.assign({}, b, {capturas:(b.capturas||[]).filter(x => x.id !== n.id).concat(n)});
    closeModal(); S.ftab = "capturas"; await saveBird(nb); toast("Captura guardada");
  });
}
function armOrRun(btn, fn){
  if (btn.classList.contains("armed")) { fn(); return; }
  btn.classList.add("armed"); const t = btn.textContent; btn.textContent = "¿Seguro? Toca otra vez";
  setTimeout(() => { if (btn.isConnected){ btn.classList.remove("armed"); btn.textContent = t; } }, 4000);
}
let toastT;
function toast(msg){ $("#toast-root").innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => $("#toast-root").innerHTML = "", 3200); }


/* ---------- Tutorial ---------- */
const TOUR_KEY = "palomar.tour.v1";
const TOUR = [
  {splash:true},
  {vid:"completo", vlabel:"Video: así se usa la app", noart:false, h:"Bienvenido a Mi Palomar", p:"Es la libreta del palomero en el teléfono. Anotas tus palomas y la app hace lo demás.",
   l:["Pedigree solo","Carreras y capturas","Cría, vacunas y ranking","Compra, venta y foro"],
   art:`<div style="text-align:center"><div style="width:84px;height:84px;margin:0 auto;color:var(--accent)">${PIGEON}</div><div class="nmb" style="font-size:30px;margin-top:6px">MI <span style="color:var(--sheen)">PALOMAR</span></div></div>`},
  {vid:"agregar", h:"Agrega tus palomas", p:"Toca “Agregar paloma”. Pon la anilla y escoge el padre y la madre. Con eso la app arma sola el pedigree.",
   l:["Empieza por los padres, después los pichones"],
   art:`<div class="mped"><div class="demo" style="grid-row:span 2;border-left:4px solid var(--accent)"><div class="lbl">Pichón</div><div class="nmb">Tormenta</div></div><div class="demo" style="border-left:4px solid var(--accent)"><b>Papá: Relámpago</b><div class="meta" style="font-size:11px">1º de 102 en Ocala</div></div><div class="demo" style="border-left:4px solid var(--sheen)"><b>Mamá: La Negra</b></div></div>`},
  {vid:"anotar", h:"Anota lo que pasa", p:"Usa los botones grandes de arriba: “Anotar carrera”, “Anotar captura” y “Nueva nidada”. La app te avisa cuándo nacen los pichones, cuándo anillar y cuándo toca vacunar.",
   art:`<div class="qa" style="grid-template-columns:1fr 1fr;width:100%;max-width:320px;margin:0"><button tabindex="-1" class="main"><span class="ic">${QI.add}</span><b>Agregar paloma</b></button><button tabindex="-1"><span class="ic">${QI.race}</span><b>Anotar carrera</b></button><button tabindex="-1"><span class="ic">${QI.cap}</span><b>Anotar captura</b></button><button tabindex="-1"><span class="ic">${QI.egg}</span><b>Nueva nidada</b></button></div>`},
  {vid:"secciones", h:"Abajo están las secciones", p:"Palomar, Pedigree, Cría, Ranking y Comunidad. En Pedigree puedes ver si dos palomas son parientes. En Comunidad compras, vendes y hablas con otros palomeros.",
   art:`<div class="demo" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:340px;color:var(--muted);font-size:11px;text-align:center">${["palomar","pedigree","cria","ranking","comunidad"].map((k,i) => `<div style="${i===0?"color:var(--accent);font-weight:700":""}"><div style="width:26px;height:26px;margin:0 auto">${document.querySelector('.bnav [data-nav="'+k+'"] svg').outerHTML}</div>${["Palomar","Pedigree","Cría","Ranking","Comunidad"][i]}</div>`).join("")}</div>`},
  {h:"Pruébalo sin miedo", p:"Primero verás un palomar de ejemplo. Toca lo que quieras: nada se guarda. Cuando estés listo, toca “Empezar mi palomar”.",
   l:["Este tutorial siempre está en “? Cómo funciona”"],
   art:`<div style="width:90px;height:90px;color:var(--sheen)">${PIGEON}</div>`, last:true}
];
let tourI = 0;
function openTour(i){
  tourI = Math.max(0, Math.min(TOUR.length - 1, i || 0));
  const t = TOUR[tourI];
  if (t.splash){
    const shot = (Object.values(S.birds).find(b => b.foto) || {}).foto || "fotos/moro.jpg";
    $("#tour-root").innerHTML = `<div class="scrim" style="z-index:40"><div class="tour" role="dialog" aria-modal="true" aria-label="Bienvenido a Mi Palomar">
      <div class="splash"><div class="stage"><div class="bigpig">${PIGEON}</div><div class="shot"><img src="${esc(shot)}" alt=""></div><span class="band ring">FL-2026-0118</span></div>
        <h2>Mi Palomar</h2><p>La libreta del palomero, en tu teléfono.</p></div>
      <div class="nav"><div class="dots">${TOUR.map((_,k) => `<i class="${k===tourI?"on":""}"></i>`).join("")}</div>
        <button class="btn" data-act="tourEnd" data-v="skip">Saltar</button>
        <button class="pillbtn light" style="flex:0 0 auto;min-width:0" data-act="tourNext"><span class="pc">${PIGEON}</span>Empezar</button></div></div></div>`;
    const b = $("#tour-root .pillbtn"); if (b) b.focus({preventScroll:true});
    return;
  }
  $("#tour-root").innerHTML = `<div class="scrim" style="z-index:40"><div class="tour" role="dialog" aria-modal="true" aria-label="Cómo funciona Mi Palomar">
    ${t.vid ? "" : `<div class="art">${t.art}</div>`}
    <div class="txt"><div class="step">${tourI === 1 ? "Cómo funciona" : t.last ? "Empecemos" : `Paso ${tourI - 1} de ${TOUR.length - 3}`}</div><h2>${t.h}</h2><p>${t.p}</p>${t.l ? `<ul>${t.l.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}</div>
    ${t.vid ? `<div class="vid"><div class="lbl">${t.vlabel || "Mira cómo se hace"}</div><div class="phone"><video poster="videos/${t.vid}.jpg" autoplay muted loop playsinline preload="auto" aria-label="Video: ${esc(t.h)}"><source src="videos/${t.vid}.mp4" type="video/mp4"><source src="videos/${t.vid}.webm" type="video/webm"></video></div></div>` : ""}
    <div class="nav"><div class="dots">${TOUR.map((_,k) => `<i class="${k===tourI?"on":""}"></i>`).join("")}</div>
      ${t.last ? `<button class="btn" data-act="tourEnd" data-v="demo">Ver el ejemplo</button>${S.demo ? '<button class="btn pri" data-act="tourEnd" data-v="start">Empezar mi palomar</button>' : '<button class="btn pri" data-act="tourEnd" data-v="ok">Listo</button>'}`
        : `${tourI > 1 ? '<button class="btn" data-act="tourPrev">Atrás</button>' : '<button class="btn" data-act="tourEnd" data-v="skip">Saltar</button>'}<button class="btn pri" data-act="tourNext">${tourI === 1 ? "Ver cómo funciona" : "Siguiente"}</button>`}
    </div></div></div>`;
  const b = $("#tour-root .nav .pri"); if (b) b.focus({preventScroll:true}); const tc = $("#tour-root .tour"); if (tc) tc.scrollTop = 0;
}
function closeTour(){ $("#tour-root").innerHTML = ""; lsSet(TOUR_KEY, "1"); }
let tourShown = false;
function maybeTour(){ if (tourShown) return; tourShown = true; if (S.demo || lsGet(TOUR_KEY) !== "1") openTour(0); }

/* ---------- Eventos ---------- */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "closeScrim"){ if (ev.target === el) closeModal(); return; }
  if (act === "close") return closeModal();
  if (act === "view"){ S.view = el.dataset.v; if (S.view === "foro") S.thread = null; render(); window.scrollTo(0,0); return; }
  if (act === "filter"){ S.filter = el.dataset.v; return render(); }
  if (act === "open"){ S.sel = el.dataset.id; S.view = "ficha"; S.ftab = "familia"; closeModal(); render(); window.scrollTo(0,0); return; }
  if (act === "ftab"){ S.ftab = el.dataset.v; return render(); }
  if (act === "ped"){ S.pedId = el.dataset.id; S.view = "pedigree"; render(); window.scrollTo(0,0); return; }
  if (act === "relWith"){ S.relA = el.dataset.id; S.relB = ""; S.view = "parentesco"; render(); window.scrollTo(0,0); return; }
  if (act === "mfilter"){ S.mfilter = el.dataset.v; return render(); }
  if (act === "fcat"){ S.fcat = el.dataset.v; return render(); }
  if (act === "newAd") return S.community ? adForm(null) : null;
  if (act === "editAd") return adForm(((S.raw.mercado[uid]||{}).items||[]).find(x => x.id === el.dataset.id));
  if (act === "soldAd"){ const items = ((S.raw.mercado[uid]||{}).items||[]).map(x => x.id === el.dataset.id ? Object.assign({}, x, {vendida:!x.vendida}) : x); writeMine("mercado", {items}); return; }
  if (act === "delAd") return armOrRun(el, async () => { closeModal(); if (await removeFrom("mercado", uid, "items", el.dataset.id)) toast("Anuncio borrado"); });
  if (act === "modAd") return armOrRun(el, async () => { if (await removeFrom("mercado", el.dataset.owner, "items", el.dataset.id)) toast("Anuncio quitado"); });
  if (act === "perfil") return perfilForm();
  if (act === "newPost") return postForm();
  if (act === "thread"){ S.thread = el.dataset.id; render(); window.scrollTo(0,0); return; }
  if (act === "closeThread"){ S.thread = null; return render(); }
  if (act === "sendReply") return sendReply(el.dataset.id);
  if (act === "delPost") return armOrRun(el, async () => { if (await removeFrom("foro", el.dataset.owner, "posts", el.dataset.id)){ S.thread = null; render(); toast("Tema borrado"); } });
  if (act === "delReply") return armOrRun(el, async () => { if (await removeFrom("foro", el.dataset.owner, "replies", el.dataset.id)) toast("Respuesta borrada"); });
  if (act === "copy"){ const v = el.dataset.v; const done = () => toast("Copiado: " + v); try { navigator.clipboard.writeText(v).then(done, () => toast(v)); } catch(e){ toast(v); } return; }
  if (act === "pick") return pickModal(el.dataset.k);
  if (act === "pickGo"){ S.sel = el.dataset.id; closeModal(); return el.dataset.k === "carrera" ? carreraForm(null) : capturaForm(null); }
  if (act === "sexo") return;
  if (act === "tour") return openTour(0);
  if (act === "tourNext") return openTour(tourI + 1);
  if (act === "tourPrev") return openTour(tourI - 1);
  if (act === "tourEnd"){
    closeTour();
    if (el.dataset.v === "start"){ const st = document.querySelector('[data-act="start"]'); if (st) st.click(); }
    else if (el.dataset.v === "demo"){ S.view = "palomar"; render(); window.scrollTo(0,0); }
    return;
  }
  if (act === "share") return shareModal(el.dataset.id);
  if (act === "addSalud") return saludForm(null);
  if (act === "editSalud") return saludForm((B(S.sel).salud||[]).find(c => c.id === el.dataset.cid));
  if (act === "delSalud") return armOrRun(el, async () => { const b = B(S.sel); closeModal(); await saveBird(Object.assign({}, b, {salud:(b.salud||[]).filter(c => c.id !== el.dataset.cid)})); toast("Borrado"); });
  if (act === "newNid"){ if (Object.keys(S.birds).length < 2){ toast("Primero agrega el macho y la hembra al palomar."); return; } return nidForm(null); }
  if (act === "editNid") return nidForm((S.cria.nidadas||[]).find(n => n.id === el.dataset.id));
  if (act === "delNid") return armOrRun(el, async () => { S.cria = Object.assign({}, S.cria, {nidadas:(S.cria.nidadas||[]).filter(n => n.id !== el.dataset.id)}); closeModal(); await saveCria(); toast("Nidada borrada"); });
  if (act === "addPichon") return addPichon(el.dataset.id);
  if (act === "rtab"){ S.rtab = el.dataset.v; return render(); }
  if (act === "ryear"){ S.ryear = el.dataset.v; return render(); }
  if (act === "new") return birdForm(null);
  if (act === "edit") return birdForm(B(S.sel));
  if (act === "addCarrera") return carreraForm(null);
  if (act === "editCarrera") return carreraForm((B(S.sel).carreras||[]).find(c => c.id === el.dataset.cid));
  if (act === "addCaptura") return capturaForm(null);
  if (act === "editCaptura") return capturaForm((B(S.sel).capturas||[]).find(c => c.id === el.dataset.cid));
  if (act === "delCarrera") return armOrRun(el, async () => { const b = B(S.sel); closeModal(); await saveBird(Object.assign({}, b, {carreras:b.carreras.filter(c => c.id !== el.dataset.cid)})); toast("Carrera borrada"); });
  if (act === "delCaptura") return armOrRun(el, async () => { const b = B(S.sel); closeModal(); await saveBird(Object.assign({}, b, {capturas:b.capturas.filter(c => c.id !== el.dataset.cid)})); toast("Captura borrada"); });
  if (act === "delBird") return armOrRun(el, async () => {
    const id = el.dataset.id, name = nm(B(id)); closeModal();
    delete S.birds[id]; resetMemo(); S.view = "palomar"; S.sel = null; render();
    await unpersist(id); toast(`${name} borrada`);
  });
  if (act === "start"){
    S.demo = false; S.birds = {}; S.cria = liveCria || {nidadas:[]}; lsSet(LS_STARTED, "1"); resetMemo();
    if (S.backend === "db" && liveBirds) S.birds = liveBirds;
    S.view = "palomar"; S.filter = "todos"; S.q = ""; S.sel = null; S.pedId = null; S.relA = S.relB = "";
    render(); setTimeout(() => birdForm(null), 50); return;
  }
});
document.addEventListener("input", ev => { if (ev.target.id === "q"){ S.q = ev.target.value; render(); } if (ev.target.id === "mq"){ S.mq = ev.target.value; render(); } });
document.addEventListener("change", ev => {
  const id = ev.target.id;
  if (id === "pedSel"){ S.pedId = ev.target.value; render(); }
  if (id === "relA"){ S.relA = ev.target.value; render(); }
  if (id === "relB"){ S.relB = ev.target.value; render(); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && $("#tour-root").innerHTML) return closeTour();
  if (ev.key === "Escape" && $("#modal-root").innerHTML) closeModal();
  if ($("#tour-root").innerHTML && ev.key === "ArrowRight" && tourI < TOUR.length - 1) openTour(tourI + 1);
  if ($("#tour-root").innerHTML && ev.key === "ArrowLeft" && tourI > 0) openTour(tourI - 1);
});

/* ---------- Arranque ---------- */
let liveBirds = null;
const started = () => S.startedSession || lsGet(LS_STARTED) === "1";
let liveCria = {nidadas:[]};
function applyBirds(map, cria){
  liveBirds = map; if (cria) liveCria = cria;
  const wasDemo = S.demo;
  if (Object.keys(map).length){ S.demo = false; S.birds = map; S.startedSession = true; }
  else if (started() && !S.demo){ S.birds = map; }
  else if (!S.demo && !started()){ S.demo = true; S.birds = demoBirds(); }
  if (!S.demo) { S.birds = map; S.cria = liveCria; }
  else if (!wasDemo) { S.cria = demoExtras(S.birds); }
  resetMemo(); S.ready = true; render(); maybeTour();
}
function startLocal(){
  let map = {}, ok = true;
  let cria = {nidadas:[]};
  try { const raw = localStorage.getItem(LS_KEY); if (raw) map = JSON.parse(raw) || {}; const rc = localStorage.getItem(LS_KEY + ".cria"); if (rc) cria = JSON.parse(rc) || cria; localStorage.setItem("palomar.t","1"); } catch(e){ ok = false; }
  S.backend = ok ? "local" : "memory";
  applyBirds(map, cria);
}
async function boot(){
  if (!window.claude || typeof window.claude.use !== "function") return startLocal();
  window.claude.use("downloads").then(d => { downloadsNs = d; }).catch(() => {});
  let user = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch(e){ db = null; }
  try { uid = user ? await user.id() : null; } catch(e){ uid = null; }
  if (!db || !uid) return startLocal();
  userNs = user; S.backend = "db"; S.community = true;
  try { S.isOwner = await user.isOwner(); } catch(e){}
  subscribeCommunity();
  let gotDefinitive = false;
  col().onSnapshot(snap => {
    const map = {}; let cria = {nidadas:[]};
    snap.docs.forEach(d => { if (d.id === "cfg-cria") cria = Object.assign({nidadas:[]}, d.data()); else if (!d.id.startsWith("cfg-")) map[d.id] = Object.assign({}, d.data(), {id:d.id}); });
    if (!snap.size && snap.metadata.fromCache && !gotDefinitive) return;
    gotDefinitive = true;
    applyBirds(map, cria);
  }, err => { toast("Se perdió la conexión con tu palomar. Recarga la página."); });
  setTimeout(() => { if (!S.ready){ S.backend = "db"; applyBirds({}); } }, 8000);
}
boot();
})();
</script>

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
